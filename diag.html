<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overpass Server Queue Benchmark</title>
  <style>
    * { box-sizing: border-box; font-family: monospace; }
    body { padding: 12px; background: #0f172a; color: #f8fafc; font-size: 13px; line-height: 1.5; }
    h1 { font-size: 15px; color: #38bdf8; margin: 0 0 10px 0; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    button { padding: 10px; font-weight: bold; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-all { grid-column: 1 / -1; background: #2563eb; padding: 12px; font-size: 13px; }
    .btn-ep { background: #0f766e; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #log { background: #020617; border: 1px solid #334155; border-radius: 4px; padding: 10px; min-height: 240px; white-space: pre-wrap; word-break: break-all; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .info { color: #fbbf24; }
    .lead { color: #a855f7; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Overpass Instance Queue Benchmark</h1>
  <div style="margin-bottom: 8px; color: #94a3b8; font-size: 11px;">
    Query: 5 Melksham pubs (1km) | Client timeout: 45s per test | No auto-abort
  </div>

  <div class="btn-row">
    <button id="btnAll" class="btn-all" onclick="benchmarkAll()">Run Full Benchmark (All 4 Servers)</button>
    <button class="btn-ep" onclick="benchmarkSingle(0)">1. overpass-api.de</button>
    <button class="btn-ep" onclick="benchmarkSingle(1)">2. lz4 cluster</button>
    <button class="btn-ep" onclick="benchmarkSingle(2)">3. private.coffee</button>
    <button class="btn-ep" onclick="benchmarkSingle(3)">4. kumi.systems</button>
  </div>

  <div id="log">Ready. Tap 'Run Full Benchmark' to test each queue sequentially.</div>

  <script>
    const QUERY = '[out:json][timeout:10]; node(around:1000,51.372,-2.138)["amenity"="pub"]; out 5;';
    const CLIENT_TIMEOUT_MS = 45000;

    const ENDPOINTS = [
      { name: 'overpass-api.de (Main)', url: 'https://overpass-api.de/api/interpreter' },
      { name: 'lz4.overpass-api.de (LZ4 Cluster)', url: 'https://lz4.overpass-api.de/api/interpreter' },
      { name: 'overpass.private.coffee (Mirror)', url: 'https://overpass.private.coffee/api/interpreter' },
      { name: 'overpass.kumi.systems (UK/EU CDN)', url: 'https://overpass.kumi.systems/api/interpreter' }
    ];

    function append(text, type) {
      const log = document.getElementById('log');
      const span = document.createElement('span');
      if (type) span.className = type;
      span.textContent = text + '\n';
      log.appendChild(span);
    }

    function setButtonsDisabled(state) {
      const btns = document.querySelectorAll('button');
      btns.forEach(b => b.disabled = state);
    }

    async function testEndpoint(ep) {
      append(`Testing: ${ep.name}...`);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CLIENT_TIMEOUT_MS);
      const t0 = performance.now();

      try {
        const res = await fetch(ep.url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
            'Accept': 'application/json'
          },
          body: 'data=' + encodeURIComponent(QUERY),
          signal: controller.signal
        });

        clearTimeout(timer);
        const elapsed = Math.round(performance.now() - t0);

        if (!res.ok) {
          append(`  -> HTTP ${res.status} (${elapsed}ms)`, 'fail');
          return { name: ep.name, ok: false, status: res.status, elapsed };
        }

        const raw = await res.text();
        const json = JSON.parse(raw);
        const count = (json.elements || []).length;

        append(`  -> HTTP 200 OK | Queue + Execution: ${elapsed}ms | Results: ${count}`, 'pass');
        return { name: ep.name, ok: true, status: 200, elapsed, count };

      } catch (err) {
        clearTimeout(timer);
        const elapsed = Math.round(performance.now() - t0);
        const reason = err.name === 'AbortError' ? 'Timeout >45s' : err.message;
        append(`  -> FAILED (${elapsed}ms): ${reason}`, 'fail');
        return { name: ep.name, ok: false, status: reason, elapsed };
      }
    }

    async function benchmarkSingle(index) {
      setButtonsDisabled(true);
      const log = document.getElementById('log');
      log.replaceChildren();
      append(`=== TESTING SINGLE ENDPOINT ===\n`, 'info');
      await testEndpoint(ENDPOINTS[index]);
      append(`\n=== COMPLETE ===`, 'info');
      setButtonsDisabled(false);
    }

    async function benchmarkAll() {
      setButtonsDisabled(true);
      const log = document.getElementById('log');
      log.replaceChildren();
      append(`=== STARTING COMPARATIVE BENCHMARK ===\n`, 'info');

      const results = [];
      for (const ep of ENDPOINTS) {
        const res = await testEndpoint(ep);
        results.push(res);
        append(''); // Blank line spacer
      }

      append(`=== SUMMARY TABLE ===`, 'lead');
      results.forEach(r => {
        const tag = r.ok ? `SUCCESS (${r.elapsed}ms)` : `FAILED (${r.status} in ${r.elapsed}ms)`;
        append(`${r.name.padEnd(35)} : ${tag}`, r.ok ? 'pass' : 'fail');
      });

      const successful = results.filter(r => r.ok).sort((a, b) => a.elapsed - b.elapsed);
      if (successful.length > 0) {
        append(`\nFastest active server: ${successful[0].name} (${successful[0].elapsed}ms)`, 'pass');
      } else {
        append(`\nAll servers failed or timed out.`, 'fail');
      }

      setButtonsDisabled(false);
    }
  </script>
</body>
</html>
