<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UK Places Discovery - Data Quality PoC (v5)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 10px; background: #f4f5f7; color: #1f2937; font-size: 14px; }
    h1 { font-size: 16px; margin: 0 0 8px 0; }
    .panel { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #d1d5db; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .full { grid-column: 1 / -1; }
    input, select, button { width: 100%; padding: 9px; border: 1px solid #9ca3af; border-radius: 4px; font-size: 14px; background: #fff; }
    button.primary { background: #1d4ed8; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    button.primary:disabled { background: #6b7280; cursor: wait; }
    #telemetry { font-family: monospace; font-size: 12px; background: #111827; color: #10b981; padding: 8px; border-radius: 4px; margin-bottom: 10px; white-space: pre-wrap; line-height: 1.4; }
    #telemetry.error { color: #f87171; }
    #map { height: 280px; width: 100%; border-radius: 6px; border: 1px solid #d1d5db; margin-bottom: 10px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .tab-btn { flex: 1; padding: 8px; background: #e5e7eb; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: #1f2937; color: #fff; }
    .card { background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; }
    .card-info { flex: 1; padding-right: 8px; cursor: pointer; }
    .card-title { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 3px; }
    .card-subfeatures { font-size: 12px; color: #4338ca; background: #eef2ff; padding: 3px 6px; border-radius: 4px; margin-bottom: 6px; display: inline-block; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .badge.cat { background: #e0e7ff; color: #1e40af; }
    .badge.ver-unverified { background: #f3f4f6; color: #4b5563; }
    .badge.access-free { background: #ccfbf1; color: #115e59; }
    .badge.access-paid { background: #fee2e2; color: #991b1b; }
    .badge.access-unknown { background: #f3f4f6; color: #374151; }
    .badge.benefit { background: #fae8ff; color: #86198f; }
    .badge.benefit-unconfirmed { background: #fef9c3; color: #854d0e; }
    .badge.benefit-confirmed { background: #dcfce7; color: #166534; }
    .card-details { font-size: 12px; color: #4b5563; line-height: 1.45; }
    .card-links { margin-top: 5px; font-size: 12px; }
    .card-links a { color: #2563eb; text-decoration: none; font-weight: 600; margin-right: 10px; }
    .fav-btn { width: auto; padding: 6px 10px; font-size: 12px; background: #f3f4f6; border: 1px solid #d1d5db; cursor: pointer; flex-shrink: 0; }
    .fav-btn.saved { background: #fef08a; border-color: #eab308; font-weight: 600; }
  </style>
</head>
<body>

  <div class="panel">
    <h1>UK Places Discovery - Data Quality PoC</h1>
    <div class="grid">
      <input type="text" id="locationInput" class="full" placeholder="Postcode (e.g. SN12 6AA) or Town (e.g. Melksham)" value="Melksham">
      <select id="radiusSelect">
        <option value="10" selected>10 Miles</option>
        <option value="25">25 Miles</option>
        <option value="50">50 Miles</option>
        <option value="100">100 Miles</option>
      </select>
      <select id="categorySelect">
        <option value="nt">1. National Trust</option>
        <option value="eh">2. English Heritage</option>
        <option value="ccc">3. Camping &amp; Caravanning Club</option>
        <option value="castles">4. Castles &amp; Historic Ruins</option>
        <option value="museums">5. Museums</option>
        <option value="nature">6. Nature Reserves</option>
        <option value="parks">7. Country Parks</option>
        <option value="viewpoints">8. Viewpoints</option>
        <option value="all">9. All Categories (Tiered Test)</option>
      </select>
      <button id="searchBtn" class="primary full" type="button">Run Technical Test</button>
    </div>
  </div>

  <div id="telemetry">Initialising technical test environment...</div>
  <div id="map"></div>

  <div class="tabs">
    <button id="tabResults" class="tab-btn active" type="button">Search Results (<span id="resCount">0</span>)</button>
    <button id="tabFavs" class="tab-btn" type="button">Saved Favourites (<span id="favCount">0</span>)</button>
  </div>

  <div id="listContainer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function() {
      const FAV_KEY = 'uk_places_poc_favs_v5';
      const MAX_UI_RENDER = 300;
      const OVERPASS_ENDPOINT = 'https://overpass-api.de/api/interpreter';
      const CLIENT_TIMEOUT_MS = 60000;

      let map = null;
      let markersLayer = null;
      let centerCircle = null;
      let markerById = new Map();
      let currentResults = [];
      let lastSearchMeta = null;
      let activeTab = 'results';
      let memoryFavs = [];
      let storageAvailable = false;
      let timerInterval = null;

      // 1. Storage Wrapper
      function checkStorage() {
        try {
          const testKey = '__poc_storage_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
          storageAvailable = true;
          return 'YES (localStorage writable)';
        } catch (err) {
          storageAvailable = false;
          return 'NO (Fallback to session memory)';
        }
      }

      function getFavs() {
        if (!storageAvailable) return memoryFavs.slice();
        try {
          const raw = window.localStorage.getItem(FAV_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
          return memoryFavs.slice();
        }
      }

      function saveFavs(favArray) {
        memoryFavs = favArray.slice();
        if (!storageAvailable) return;
        try {
          window.localStorage.setItem(FAV_KEY, JSON.stringify(favArray));
        } catch (err) {
          storageAvailable = false;
        }
      }

      function logTelemetry(msg, isError) {
        const el = document.getElementById('telemetry');
        el.textContent = msg;
        el.className = isError ? 'error' : '';
      }

      // 2. Network Fetch Helper
      async function fetchWithTimeout(url, options, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(function() { controller.abort(); }, timeoutMs);
        try {
          const response = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
          clearTimeout(timer);
          return response;
        } catch (err) {
          clearTimeout(timer);
          if (err.name === 'AbortError') {
            throw new Error('Connection timed out after ' + Math.round(timeoutMs / 1000) + ' seconds.');
          }
          throw new Error('Network error (' + (err.message || 'fetch failed') + ')');
        }
      }

      // 3. Geocoding Layer
      async function geocodeInput(rawInput) {
        const cleaned = (rawInput || '').trim();
        if (!cleaned) throw new Error('Please enter a UK postcode or town name.');

        const ukPostcodeRegex = /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i;
        const outcodeRegex = /^[A-Z]{1,2}\d[A-Z\d]?$/i;
        const t0 = performance.now();

        if (ukPostcodeRegex.test(cleaned) || outcodeRegex.test(cleaned)) {
          const isFull = ukPostcodeRegex.test(cleaned);
          const endpoint = isFull
            ? 'https://api.postcodes.io/postcodes/' + encodeURIComponent(cleaned)
            : 'https://api.postcodes.io/outcodes/' + encodeURIComponent(cleaned);

          const res = await fetchWithTimeout(endpoint, {}, 10000);
          if (res.status === 404) throw new Error('Postcode "' + cleaned + '" not found by Postcodes.io.');
          if (!res.ok) throw new Error('Postcodes.io HTTP ' + res.status);
          const data = await res.json();
          if (!data || !data.result || typeof data.result.latitude !== 'number') {
            throw new Error('Postcodes.io returned invalid coordinates.');
          }
          return {
            lat: data.result.latitude,
            lon: data.result.longitude,
            label: data.result.postcode || data.result.outcode || cleaned.toUpperCase(),
            source: 'Postcodes.io',
            ms: Math.round(performance.now() - t0)
          };
        } else {
          const url = 'https://nominatim.openstreetmap.org/search?format=json&countrycodes=gb&limit=1&q=' + encodeURIComponent(cleaned);
          const res = await fetchWithTimeout(url, { headers: { 'Accept-Language': 'en-GB' } }, 10000);
          if (res.status === 429) throw new Error('Nominatim rate limit reached. Wait 2 seconds and retry.');
          if (!res.ok) throw new Error('Nominatim HTTP ' + res.status);
          const data = await res.json();
          if (!Array.isArray(data) || data.length === 0) {
            throw new Error('No UK town found matching "' + cleaned + '".');
          }
          return {
            lat: parseFloat(data[0].lat),
            lon: parseFloat(data[0].lon),
            label: String(data[0].display_name || cleaned).split(',')[0],
            source: 'OSM Nominatim',
            ms: Math.round(performance.now() - t0)
          };
        }
      }

      // 4. Bounding Box & Query Builder
      function getBoundingBox(lat, lon, radiusMiles) {
        const latDelta = radiusMiles / 69.0;
        const lonDelta = radiusMiles / (69.0 * Math.cos(lat * Math.PI / 180));
        const south = (lat - latDelta).toFixed(4);
        const west = (lon - lonDelta).toFixed(4);
        const north = (lat + latDelta).toFixed(4);
        const east = (lon + lonDelta).toFixed(4);
        return south + ',' + west + ',' + north + ',' + east;
      }

      function buildOverpassQuery(category, lat, lon, radiusMiles) {
        const bbox = getBoundingBox(lat, lon, radiusMiles);
        const isWide = radiusMiles >= 50;
        const serverTimeout = isWide ? 25 : 15;

        let body = '';
        let strategyNote = 'BBox index search + client distance sort';

        switch (category) {
          case 'nt':
            body = '(' +
              'nwr["operator:wikidata"="Q333515"]["name"];' +
              'nwr["operator"="National Trust"]["name"];' +
              'nwr["operator"="The National Trust"]["name"];' +
            ');';
            break;

          case 'eh':
            body = '(' +
              'nwr["operator:wikidata"="Q936287"]["name"];' +
              'nwr["operator"="English Heritage"]["name"];' +
              'nwr["operator"="English Heritage Trust"]["name"];' +
            ');';
            break;

          case 'ccc':
            if (isWide) {
              strategyNote = '50-100mi C&CC: BBox campsite tag + Club filter';
              body = '(' +
                'nwr["tourism"="camp_site"]["operator:wikidata"="Q7721188"];' +
                'nwr["tourism"="caravan_site"]["operator:wikidata"="Q7721188"];' +
                'nwr["tourism"="camp_site"]["operator"~"Camping and Caravanning Club"];' +
                'nwr["tourism"="caravan_site"]["operator"~"Camping and Caravanning Club"];' +
                'nwr["tourism"="camp_site"]["name"~"Camping and Caravanning Club"];' +
                'nwr["tourism"="caravan_site"]["name"~"Camping and Caravanning Club"];' +
              ');';
            } else {
              strategyNote = '10-25mi C&CC: Fast BBox campsite query + client Club filter';
              body = '(' +
                'nwr["tourism"="camp_site"]["name"];' +
                'nwr["tourism"="caravan_site"]["name"];' +
              ');';
            }
            break;

          case 'castles':
            body = isWide
              ? '(nwr["historic"="castle"]["name"];nwr["historic"="ruins"]["wikidata"]["name"];);'
              : '(nwr["historic"="castle"]["name"];nwr["historic"="ruins"]["name"];);';
            break;

          case 'museums':
            body = isWide
              ? 'nwr["tourism"="museum"]["wikidata"]["name"];'
              : 'nwr["tourism"="museum"]["name"];';
            break;

          case 'nature':
            body = isWide
              ? 'nwr["leisure"="nature_reserve"]["wikidata"]["name"];'
              : 'nwr["leisure"="nature_reserve"]["name"];';
            break;

          case 'parks':
            body = '(' +
              'nwr["designation"="country_park"]["name"];' +
              'nwr["leisure"="park"]["name"~"Country Park"];' +
            ');';
            break;

          case 'viewpoints':
            body = isWide
              ? 'nwr["tourism"="viewpoint"]["wikidata"]["name"];'
              : 'nwr["tourism"="viewpoint"]["name"];';
            break;

          case 'all':
            if (isWide) {
              strategyNote = '50-100mi Tiered All: NT, EH, C&CC, Parks & Wikidata Castles/Museums';
              body = '(' +
                'nwr["operator:wikidata"="Q333515"]["name"];' +
                'nwr["operator"="National Trust"]["name"];' +
                'nwr["operator:wikidata"="Q936287"]["name"];' +
                'nwr["operator"="English Heritage"]["name"];' +
                'nwr["tourism"="camp_site"]["operator"~"Camping and Caravanning Club"];' +
                'nwr["tourism"="caravan_site"]["operator"~"Camping and Caravanning Club"];' +
                'nwr["historic"="castle"]["wikidata"]["name"];' +
                'nwr["tourism"="museum"]["wikidata"]["name"];' +
                'nwr["designation"="country_park"]["name"];' +
              ');';
            } else {
              body = '(' +
                'nwr["operator:wikidata"="Q333515"]["name"];' +
                'nwr["operator"="National Trust"]["name"];' +
                'nwr["operator:wikidata"="Q936287"]["name"];' +
                'nwr["operator"="English Heritage"]["name"];' +
                'nwr["tourism"="camp_site"]["name"];' +
                'nwr["tourism"="caravan_site"]["name"];' +
                'nwr["historic"="castle"]["name"];' +
                'nwr["historic"="ruins"]["name"];' +
                'nwr["tourism"="museum"]["name"];' +
                'nwr["leisure"="nature_reserve"]["name"];' +
                'nwr["designation"="country_park"]["name"];' +
                'nwr["tourism"="viewpoint"]["name"];' +
              ');';
            }
            break;
        }

        const ql = '[out:json][timeout:' + serverTimeout + '][bbox:' + bbox + '];' + body + 'out center qt;';
        return { ql: ql, strategyNote: strategyNote };
      }

      // 5. Strict Data Quality Classification
      function classifyDataQuality(tags) {
        const op = (tags.operator || '').trim();
        const opWiki = (tags['operator:wikidata'] || '').trim();
        const brand = (tags.brand || '').trim();
        const owner = (tags.owner || '').trim();
        const name = (tags.name || '').trim();
        const heritageOp = (tags['heritage:operator'] || '').trim();
        const website = (tags.website || tags['contact:website'] || '').trim();
        const fee = (tags.fee || '').trim().toLowerCase();
        const charge = (tags.charge || '').trim();

        const nameLower = name.toLowerCase();
        const opLower = op.toLowerCase();
        const brandLower = brand.toLowerCase();
        const ownerLower = owner.toLowerCase();
        const webLower = website.toLowerCase();

        // A. Evidence Source
        const evidenceParts = [];
        if (op) evidenceParts.push('operator="' + op + '"');
        if (opWiki) evidenceParts.push('operator:wikidata=' + opWiki);
        if (brand) evidenceParts.push('brand="' + brand + '"');
        if (owner) evidenceParts.push('owner="' + owner + '"');
        if (fee) evidenceParts.push('fee="' + fee + '"');
        if (charge) evidenceParts.push('charge="' + charge + '"');
        if (heritageOp) evidenceParts.push('heritage:operator="' + heritageOp + '"');

        const evidenceSource = evidenceParts.length > 0
          ? 'OSM tags: ' + evidenceParts.join('; ')
          : 'None (Unspecified in OSM)';

        // B. Managing Organisation
        let managingOrg = op || brand || owner;
        if (!managingOrg) {
          if (opWiki === 'Q333515') {
            managingOrg = 'National Trust';
          } else if (opWiki === 'Q936287') {
            managingOrg = 'English Heritage';
          } else if (opWiki === 'Q7721188') {
            managingOrg = 'The Camping and Caravanning Club';
          } else if (heritageOp) {
            managingOrg = 'Listed monument (' + heritageOp + ')';
          } else {
            managingOrg = 'Unknown / Unlisted';
          }
        }

        // C. Membership Association
        const isNt = (
          opWiki === 'Q333515' || opWiki === 'Q1968638' ||
          opLower.includes('national trust') ||
          brandLower.includes('national trust') ||
          ownerLower.includes('national trust') ||
          webLower.includes('nationaltrust.org.uk')
        );

        const isEh = (
          opWiki === 'Q936287' ||
          opLower.includes('english heritage') ||
          brandLower.includes('english heritage') ||
          ownerLower.includes('english heritage') ||
          webLower.includes('english-heritage.org.uk')
        );

        const isCcc = (
          opWiki === 'Q7721188' ||
          opLower.includes('camping and caravanning club') ||
          opLower.includes('camping & caravanning club') ||
          brandLower.includes('camping and caravanning club') ||
          brandLower.includes('camping & caravanning club') ||
          nameLower.includes('camping and caravanning club') ||
          nameLower.includes('camping & caravanning club') ||
          webLower.includes('campingandcaravanningclub.co.uk')
        );

        let membershipAssoc = 'Unknown';
        if (isNt) {
          membershipAssoc = 'National Trust';
        } else if (isEh) {
          membershipAssoc = 'English Heritage';
        } else if (isCcc) {
          membershipAssoc = 'The Camping and Caravanning Club';
        } else if (managingOrg !== 'Unknown / Unlisted') {
          membershipAssoc = 'Not applicable';
        } else {
          membershipAssoc = 'Unknown';
        }

        // D. Membership Benefit Status
        let membershipBenefit = 'Unknown';
        if (isNt || isEh || isCcc) {
          membershipBenefit = 'Associated organisation – membership benefit unconfirmed';
        } else if (membershipAssoc === 'Not applicable') {
          membershipBenefit = 'Not applicable';
        } else {
          membershipBenefit = 'Unknown';
        }

        // E. Public Access Status
        let publicAccessStatus = 'Unknown';
        if (fee === 'no' || charge === '0') {
          publicAccessStatus = 'Free public access';
        } else if (fee === 'yes' || (charge && charge !== '0')) {
          publicAccessStatus = 'Paid entry';
        } else {
          publicAccessStatus = 'Unknown';
        }

        // F. Verification Status
        const verificationStatus = 'Unverified';

        return {
          managingOrg: managingOrg,
          membershipAssoc: membershipAssoc,
          membershipBenefit: membershipBenefit,
          publicAccessStatus: publicAccessStatus,
          evidenceSource: evidenceSource,
          verificationStatus: verificationStatus,
          officialWebsite: website || null
        };
      }

      function isExcludedMinorAsset(tags) {
        const amenity = tags.amenity || '';
        if (amenity === 'parking' || amenity === 'bench' || amenity === 'toilets' || amenity === 'waste_basket' || amenity === 'cafe' || amenity === 'fast_food') return true;
        if (tags.highway === 'bus_stop' || tags.shop || tags.building === 'residential' || tags.building === 'house') return true;
        return false;
      }

      function classifyCategory(tags, quality) {
        if (quality.membershipAssoc === 'National Trust') return 'National Trust';
        if (quality.membershipAssoc === 'English Heritage') return 'English Heritage';
        if (quality.membershipAssoc === 'The Camping and Caravanning Club') return 'C&CC Campsite';
        if (tags.historic === 'castle') return 'Castle';
        if (tags.historic === 'ruins') return 'Historic Ruins';
        if (tags.tourism === 'museum') return 'Museum';
        if (tags.designation === 'country_park' || /country park/i.test(tags.name || '')) return 'Country Park';
        if (tags.leisure === 'nature_reserve') return 'Nature Reserve';
        if (tags.tourism === 'viewpoint') return 'Viewpoint';
        if (tags.tourism === 'camp_site' || tags.tourism === 'caravan_site') return 'Campsite';
        return 'Place of Interest';
      }

      function calcMiles(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function getFeatureRank(tags) {
        const h = tags.historic || '';
        const t = tags.tourism || '';
        if (['castle', 'abbey', 'manor', 'palace'].includes(h)) return 100;
        if (tags.designation === 'country_park') return 90;
        if (t === 'museum') return 80;
        if (h === 'house') return 70;
        if (t === 'attraction') return 60;
        if (tags.leisure === 'garden' || tags.leisure === 'park') return 50;
        if (h === 'ruins') return 40;
        return 10;
      }

      // 6. Evidence-Based Duplicate and Sub-Feature Consolidation
      function evaluateConsolidationEvidence(a, b, distMiles) {
        if (distMiles > 0.25) return null;

        const aTags = a.tags || {};
        const bTags = b.tags || {};
        const aName = (a.name || '').trim();
        const bName = (b.name || '').trim();
        const aLower = aName.toLowerCase();
        const bLower = bName.toLowerCase();

        // 1. Shared Wikidata Identifier
        const aWiki = (aTags.wikidata || aTags['subject:wikidata'] || '').trim();
        const bWiki = (bTags.wikidata || bTags['subject:wikidata'] || '').trim();
        if (aWiki && bWiki && aWiki === bWiki) {
          return 'Shared Wikidata (' + aWiki + ')';
        }

        // 2. Shared Parent Site or Estate Reference
        const aParent = (aTags.is_in || aTags.site_name || aTags.part_of || aTags.parent_site || '').trim().toLowerCase();
        const bParent = (bTags.is_in || bTags.site_name || bTags.part_of || bTags.parent_site || '').trim().toLowerCase();

        if (aParent && (aParent === bLower || aParent.includes(bLower))) {
          return 'Parent estate reference (is_in: ' + (aTags.is_in || aParent) + ')';
        }
        if (bParent && (bParent === aLower || bParent.includes(aLower))) {
          return 'Parent estate reference (is_in: ' + (bTags.is_in || bParent) + ')';
        }
        if (aParent && bParent && aParent === bParent) {
          return 'Shared parent estate (' + aParent + ')';
        }

        // 3. Strongly Matching Names and Location
        // 3a. Exact Normalized Name
        const normA = aLower.replace(/[^a-z0-9]/g, '');
        const normB = bLower.replace(/[^a-z0-9]/g, '');
        if (normA && normA === normB) {
          return 'Identical name within 0.25 miles';
        }

        // 3b. Hierarchical Name Match
        const pairs = [
          { parent: aLower, child: bLower, pName: aName, cName: bName },
          { parent: bLower, child: aLower, pName: bName, cName: aName }
        ];

        for (let k = 0; k < pairs.length; k++) {
          const p = pairs[k].parent;
          const c = pairs[k].child;
          if (p.length >= 4) {
            if (c.startsWith(p + ' ') || c.startsWith(p + ' - ') || c.startsWith(p + ' – ') || c.startsWith(p + ': ') || c.startsWith(p + ', ')) {
              return 'Hierarchical name match ("' + pairs[k].pName + '" -> "' + pairs[k].cName + '")';
            }
            if (c.includes('(' + p + ')') || c.endsWith(' at ' + p) || c.endsWith(', ' + p)) {
              return 'Sub-feature site reference ("' + pairs[k].cName + '" at "' + pairs[k].pName + '")';
            }
          }
        }

        // 4. Same OSM ID
        if (a.id === b.id) {
          return 'Same OSM feature ID';
        }

        return null;
      }

      function processAndConsolidateElements(elements, centerLat, centerLon, radiusMiles, selectedCategory) {
        const rawList = [];

        for (let i = 0; i < elements.length; i++) {
          const el = elements[i];
          const elLat = typeof el.lat === 'number' ? el.lat : (el.center && typeof el.center.lat === 'number' ? el.center.lat : null);
          const elLon = typeof el.lon === 'number' ? el.lon : (el.center && typeof el.center.lon === 'number' ? el.center.lon : null);
          if (elLat === null || elLon === null) continue;

          const distMiles = calcMiles(centerLat, centerLon, elLat, elLon);
          if (distMiles > radiusMiles) continue;

          const tags = el.tags || {};
          const name = (tags.name || '').trim();
          if (!name || isExcludedMinorAsset(tags)) continue;

          const quality = classifyDataQuality(tags);

          if (selectedCategory === 'nt' && quality.membershipAssoc !== 'National Trust') continue;
          if (selectedCategory === 'eh' && quality.membershipAssoc !== 'English Heritage') continue;
          if (selectedCategory === 'ccc' && quality.membershipAssoc !== 'The Camping and Caravanning Club') continue;
          if (selectedCategory === 'all' && (tags.tourism === 'camp_site' || tags.tourism === 'caravan_site') && quality.membershipAssoc !== 'The Camping and Caravanning Club') continue;

          rawList.push({
            id: el.type + '_' + el.id,
            name: name,
            lat: elLat,
            lon: elLon,
            miles: Number(distMiles.toFixed(1)),
            tags: tags,
            quality: quality,
            categoryLabel: classifyCategory(tags, quality),
            rank: getFeatureRank(tags),
            subFeatures: []
          });
        }

        const consolidated = [];
        const absorbedIds = new Set();

        for (let i = 0; i < rawList.length; i++) {
          const a = rawList[i];
          if (absorbedIds.has(a.id)) continue;

          for (let j = i + 1; j < rawList.length; j++) {
            const b = rawList[j];
            if (absorbedIds.has(b.id)) continue;

            const sepMiles = calcMiles(a.lat, a.lon, b.lat, b.lon);
            const mergeEvidence = evaluateConsolidationEvidence(a, b, sepMiles);

            if (mergeEvidence) {
              if (b.rank > a.rank) {
                b.subFeatures.push(a.name);
                if (!b.quality.officialWebsite && a.quality.officialWebsite) {
                  b.quality.officialWebsite = a.quality.officialWebsite;
                }
                if (b.quality.publicAccessStatus === 'Unknown' && a.quality.publicAccessStatus !== 'Unknown') {
                  b.quality.publicAccessStatus = a.quality.publicAccessStatus;
                }
                absorbedIds.add(a.id);
                break;
              } else {
                a.subFeatures.push(b.name);
                if (!a.quality.officialWebsite && b.quality.officialWebsite) {
                  a.quality.officialWebsite = b.quality.officialWebsite;
                }
                if (a.quality.publicAccessStatus === 'Unknown' && b.quality.publicAccessStatus !== 'Unknown') {
                  a.quality.publicAccessStatus = b.quality.publicAccessStatus;
                }
                absorbedIds.add(b.id);
              }
            }
          }

          if (!absorbedIds.has(a.id)) {
            consolidated.push(a);
          }
        }

        consolidated.sort(function(x, y) { return x.miles - y.miles; });

        return {
          all: consolidated,
          rendered: consolidated.slice(0, MAX_UI_RENDER),
          consolidatedCount: rawList.length - consolidated.length
        };
      }

      // 7. Search Execution with Live Telemetry
      async function runPoCTest() {
        const btn = document.getElementById('searchBtn');
        const inputVal = document.getElementById('locationInput').value;
        const radius = parseInt(document.getElementById('radiusSelect').value, 10);
        const category = document.getElementById('categorySelect').value;

        btn.disabled = true;
        logTelemetry('Step 1/2: Resolving location...', false);

        try {
          const geo = await geocodeInput(inputVal);
          lastSearchMeta = { lat: geo.lat, lon: geo.lon, radius: radius };

          const querySpec = buildOverpassQuery(category, geo.lat, geo.lon, radius);
          const t0 = performance.now();

          let elapsedSec = 0;
          btn.textContent = 'Waiting in Overpass queue (' + elapsedSec + 's)...';
          timerInterval = setInterval(function() {
            elapsedSec++;
            btn.textContent = 'Waiting in Overpass queue (' + elapsedSec + 's)...';
          }, 1000);

          logTelemetry(
            'Location OK (' + geo.source + '): ' + geo.label + ' [' + geo.lat.toFixed(4) + ', ' + geo.lon.toFixed(4) + ']\n' +
            'Step 2/2: Querying overpass-api.de...',
            false
          );

          const res = await fetchWithTimeout(
            OVERPASS_ENDPOINT,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
              body: 'data=' + encodeURIComponent(querySpec.ql)
            },
            CLIENT_TIMEOUT_MS
          );

          clearInterval(timerInterval);
          btn.textContent = 'Processing & consolidating data...';
          const totalMs = Math.round(performance.now() - t0);

          if (res.status === 502) {
            throw new Error('Overpass server at capacity (HTTP 502). Please wait 20 seconds and retry.');
          }
          if (res.status === 429) {
            throw new Error('Overpass rate limit reached (HTTP 429). Please wait a moment.');
          }
          if (!res.ok) throw new Error('Overpass error (HTTP ' + res.status + ').');

          const data = await res.json();
          if (data.remark && data.remark.toLowerCase().includes('timed out')) {
            throw new Error('Overpass server execution timeout: ' + data.remark);
          }

          const rawElements = Array.isArray(data.elements) ? data.elements : [];
          const processed = processAndConsolidateElements(rawElements, geo.lat, geo.lon, radius, category);
          currentResults = processed.rendered;

          switchTab('results');

          logTelemetry(
            'Target: ' + geo.label + ' (' + geo.source + ' in ' + geo.ms + 'ms)\n' +
            'Overpass response: ' + totalMs + 'ms\n' +
            'Consolidated destinations within ' + radius + ' miles: ' + processed.all.length + '\n' +
            '(Evidence-based mergers: ' + processed.consolidatedCount + '; distinct destinations preserved)\n' +
            'Strategy: ' + querySpec.strategyNote,
            false
          );
        } catch (err) {
          clearInterval(timerInterval);
          logTelemetry('ERROR: ' + err.message, true);
        } finally {
          clearInterval(timerInterval);
          btn.disabled = false;
          btn.textContent = 'Run Technical Test';
        }
      }

      // 8. Safe DOM Rendering & Map Synchronisation
      function buildPopupElement(item) {
        const q = item.quality || {};
        const wrap = document.createElement('div');

        const title = document.createElement('strong');
        title.textContent = item.name;
        wrap.appendChild(title);
        wrap.appendChild(document.createElement('br'));

        const sub = document.createElement('span');
        sub.textContent = item.categoryLabel + ' • ' + item.miles + ' miles';
        wrap.appendChild(sub);
        wrap.appendChild(document.createElement('br'));

        const org = document.createElement('span');
        org.textContent = 'Managing Org: ' + (q.managingOrg || 'Unlisted');
        wrap.appendChild(org);
        wrap.appendChild(document.createElement('br'));

        const benefit = document.createElement('span');
        benefit.textContent = 'Benefit: ' + (q.membershipBenefit || 'Unknown');
        wrap.appendChild(benefit);
        wrap.appendChild(document.createElement('br'));

        const access = document.createElement('span');
        access.textContent = 'Access: ' + (q.publicAccessStatus || 'Unknown') + ' (' + (q.verificationStatus || 'Unverified') + ')';
        wrap.appendChild(access);

        return wrap;
      }

      function renderMapForActiveList(items) {
        markersLayer.clearLayers();
        markerById.clear();
        if (centerCircle) {
          map.removeLayer(centerCircle);
          centerCircle = null;
        }

        if (activeTab === 'results' && lastSearchMeta) {
          centerCircle = L.circle([lastSearchMeta.lat, lastSearchMeta.lon], {
            radius: lastSearchMeta.radius * 1609.34,
            color: '#1d4ed8',
            weight: 1,
            fillOpacity: 0.05
          }).addTo(map);
        }

        const boundsPoints = [];
        items.forEach(function(item) {
          if (typeof item.lat !== 'number' || typeof item.lon !== 'number') return;
          const marker = L.marker([item.lat, item.lon]);
          marker.bindPopup(buildPopupElement(item));
          marker.addTo(markersLayer);
          markerById.set(item.id, marker);
          boundsPoints.push([item.lat, item.lon]);
        });

        if (activeTab === 'results' && centerCircle) {
          map.fitBounds(centerCircle.getBounds());
        } else if (boundsPoints.length > 0) {
          map.fitBounds(L.latLngBounds(boundsPoints), { padding: [25, 25], maxZoom: 13 });
        }
      }

      function focusLocationOnMap(item) {
        if (!map) return;
        map.setView([item.lat, item.lon], 14);
        const marker = markerById.get(item.id);
        if (marker) marker.openPopup();
      }

      function toggleFav(item) {
        let favs = getFavs();
        const exists = favs.some(function(f) { return f.id === item.id; });
        if (exists) {
          favs = favs.filter(function(f) { return f.id !== item.id; });
        } else {
          favs.push(item);
        }
        saveFavs(favs);
        updateCounts();
        renderActiveView();
      }

      function updateCounts() {
        document.getElementById('resCount').textContent = String(currentResults.length);
        document.getElementById('favCount').textContent = String(getFavs().length);
      }

      function switchTab(tab) {
        activeTab = tab;
        document.getElementById('tabResults').classList.toggle('active', tab === 'results');
        document.getElementById('tabFavs').classList.toggle('active', tab === 'favs');
        renderActiveView();
      }

      function renderActiveView() {
        updateCounts();
        const favs = getFavs();
        const favIds = new Set(favs.map(function(f) { return f.id; }));
        const activeList = activeTab === 'results' ? currentResults : favs;

        renderMapForActiveList(activeList);

        const container = document.getElementById('listContainer');
        container.replaceChildren();

        if (activeList.length === 0) {
          const emptyPanel = document.createElement('div');
          emptyPanel.className = 'panel';
          emptyPanel.textContent = activeTab === 'results'
            ? 'No matching locations found within the selected radius.'
            : 'No saved favourites yet. Tap Save on any result to test persistence.';
          container.appendChild(emptyPanel);
          return;
        }

        const fragment = document.createDocumentFragment();

        activeList.forEach(function(item) {
          const q = item.quality || {};
          const card = document.createElement('div');
          card.className = 'card';

          const info = document.createElement('div');
          info.className = 'card-info';
          info.addEventListener('click', function() { focusLocationOnMap(item); });

          // 1. Attraction Name
          const title = document.createElement('div');
          title.className = 'card-title';
          title.textContent = item.name;
          info.appendChild(title);

          // Sub-features list (if consolidated with evidence)
          if (item.subFeatures && item.subFeatures.length > 0) {
            const subBox = document.createElement('div');
            subBox.className = 'card-subfeatures';
            subBox.textContent = 'Includes estate features: ' + item.subFeatures.join(', ');
            info.appendChild(subBox);
          }

          // 2. Badges Row
          const badgeRow = document.createElement('div');
          badgeRow.className = 'badge-row';

          // Category Badge
          const catBadge = document.createElement('span');
          catBadge.className = 'badge cat';
          catBadge.textContent = item.categoryLabel;
          badgeRow.appendChild(catBadge);

          // Access Classification Badge
          const accessStatus = q.publicAccessStatus || q.accessStatus || 'Unknown';
          const accessBadge = document.createElement('span');
          const accessClass = accessStatus === 'Free public access' ? 'free' :
                             (accessStatus === 'Paid entry' ? 'paid' : 'unknown');
          accessBadge.className = 'badge access-' + accessClass;
          accessBadge.textContent = accessStatus;
          badgeRow.appendChild(accessBadge);

          // Membership Benefit Badge
          const benefitStatus = q.membershipBenefit || 'Unknown';
          if (benefitStatus !== 'Not applicable' && benefitStatus !== 'None') {
            const benBadge = document.createElement('span');
            let benefitClass = 'benefit';
            if (benefitStatus === 'Confirmed benefit – supported by official evidence') {
              benefitClass = 'benefit-confirmed';
            } else if (benefitStatus === 'Associated organisation – membership benefit unconfirmed') {
              benefitClass = 'benefit-unconfirmed';
            }
            benBadge.className = 'badge ' + benefitClass;
            benBadge.textContent = benefitStatus;
            badgeRow.appendChild(benBadge);
          }

          // Verification Status Badge
          const verStatus = q.verificationStatus || 'Unverified';
          const verBadge = document.createElement('span');
          verBadge.className = 'badge ver-unverified';
          verBadge.textContent = verStatus;
          badgeRow.appendChild(verBadge);

          info.appendChild(badgeRow);

          // 3. Metadata Details
          const details = document.createElement('div');
          details.className = 'card-details';
          const orgStr = q.managingOrg ? 'Org: ' + q.managingOrg : '';
          const assocStr = (q.membershipAssoc && q.membershipAssoc !== 'None' && q.membershipAssoc !== 'Not applicable' && q.membershipAssoc !== 'Unknown')
            ? ' • Assoc: ' + q.membershipAssoc : '';
          const evidenceStr = q.evidenceSource ? ' • Evidence: ' + q.evidenceSource : '';
          details.textContent = item.miles + ' miles • ' + orgStr + assocStr + evidenceStr;
          info.appendChild(details);

          // 4. External Links
          const linksRow = document.createElement('div');
          linksRow.className = 'card-links';

          if (q.officialWebsite) {
            const webLink = document.createElement('a');
            webLink.href = q.officialWebsite;
            webLink.target = '_blank';
            webLink.rel = 'noopener noreferrer';
            webLink.textContent = 'Official Website';
            webLink.addEventListener('click', function(e) { e.stopPropagation(); });
            linksRow.appendChild(webLink);
          }

          const gmapsLink = document.createElement('a');
          gmapsLink.href = 'https://www.google.com/maps/search/?api=1&query=' + item.lat + ',' + item.lon;
          gmapsLink.target = '_blank';
          gmapsLink.rel = 'noopener noreferrer';
          gmapsLink.textContent = 'Google Maps Directions';
          gmapsLink.addEventListener('click', function(e) { e.stopPropagation(); });
          linksRow.appendChild(gmapsLink);

          info.appendChild(linksRow);
          card.appendChild(info);

          // Save / Favourite Button
          const isSaved = favIds.has(item.id);
          const favBtn = document.createElement('button');
          favBtn.type = 'button';
          favBtn.className = 'fav-btn' + (isSaved ? ' saved' : '');
          favBtn.textContent = isSaved ? 'Saved' : 'Save';
          favBtn.addEventListener('click', function() { toggleFav(item); });

          card.appendChild(favBtn);
          fragment.appendChild(card);
        });

        container.appendChild(fragment);
      }

      function init() {
        map = L.map('map').setView([51.372, -2.138], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);

        document.getElementById('searchBtn').addEventListener('click', runPoCTest);
        document.getElementById('tabResults').addEventListener('click', function() { switchTab('results'); });
        document.getElementById('tabFavs').addEventListener('click', function() { switchTab('favs'); });
        document.getElementById('locationInput').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') runPoCTest();
        });

        const storageStatus = checkStorage();
        updateCounts();
        logTelemetry(
          'Protocol: ' + window.location.protocol + '\n' +
          'Storage Active: ' + storageStatus + '\n' +
          'Data Quality Engine: Evidence-based schema & strict membership status\n' +
          'Ready. Default set to Melksham (10 Miles).',
          false
        );
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
